# Regenera agenda.json (página oculta agenda.html, QR para bares) varias veces al día
# y cada vez que se sube un cambio en eventos/:
# próxima Sesión desde el Google Calendar del club, Live y Rewind desde eventos/*.html.
name: Actualiza agenda

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: ["eventos/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera agenda.json
        run: python actualiza-agenda.py

      - name: Sube los cambios y republica la web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- agenda.json; then
            echo "Sin cambios en la agenda."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git commit -m "Agenda: actualizacion automatica"
          git push
          # Los push hechos con el token de Actions no siempre disparan GitHub Pages: se pide el build a mano
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se pudo pedir el build de Pages (se publicará con el próximo push)."
