# Pasa check-seo.py en cada push a main, para que nada se publique sin revisar aunque
# no se haya usado publica.py (p. ej. una edición hecha desde la web de GitHub).
# Si falla, GitHub avisa por email; la web ya está publicada, así que hay que arreglarlo y volver a subir.
name: Check SEO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisa SEO, enlaces, eventos y sincronización
        run: python check-seo.py
